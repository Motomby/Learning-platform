# ═══════════════════════════════════════════════════════════════════════════
#  Render Blueprint — E-Learning Platform
#  Upload this file in Render: Blueprints → "New from YAML"
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ======================================================================
  #  BACKEND — Node/Express API Server (Web Service)
  # ======================================================================
  - type: web
    name: elearning-api
    runtime: node
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ======================================================================
  #  FRONTEND — React Static Site
  # ======================================================================
  - type: static
    name: elearning-web
    buildCommand: npm install --prefix learning-app && npm run build --prefix learning-app
    publishDir: learning-app/build
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_BASE_URL
        fromService:
          type: web
          name: elearning-api
          property: host
        transformation: https://$VALUE/api
